name: Deploy Client Site to GCP

on:
  push:
    branches: [main]
    paths:
      - "apps/client-site/**"
      - "packages/shop/**"
      - "packages/ui/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy client site via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            cd ~/maori_stock_bot
            git pull origin main
            npm install -g pnpm@10 || true
            pnpm install --frozen-lockfile
            cd apps/client-site
            pnpm build
            pm2 describe client-site > /dev/null 2>&1 \
              && pm2 restart client-site \
              || pm2 start pnpm --name client-site -- start
            pm2 save
            sudo cp ~/maori_stock_bot/nginx/shop.conf /etc/nginx/sites-available/shop.hhippo.co.il
            sudo ln -sf /etc/nginx/sites-available/shop.hhippo.co.il /etc/nginx/sites-enabled/shop.hhippo.co.il
            sudo nginx -t && sudo systemctl reload nginx
